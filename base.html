<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="BracketFlow - Gerador e visualizador de chaveamentos de torneios. Simule o mata-mata da Copa do Mundo e crie seus próprios campeonatos." />
    <title>BracketFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100"> <!-- Adicionado classes estruturais no body -->

    <!-- Navbar Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0d3551;">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold fs-6 tracking-wide text-white" href="#">
                <i class="bi bi-soccer-ball fs-4"></i>
                COPA DO MUNDO 2026 BRACKET
            </a>
            <button id="btn-gerar" onclick="gerarTorneio()"
                class="btn btn-success d-flex align-items-center gap-2 btn-sm px-3 py-2 fw-medium" type="button"
                style="background-color: #28a745; border-color: #28a745;">
                <i class="bi bi-arrow-clockwise"></i>
                Generate Tournament
            </button>
        </div>
    </nav>

    <!-- Conteúdo Principal Dinâmico -->
    <main class="flex-grow-1 container my-4">
        <div id="bracket-container" class="d-flex justify-content-between align-items-center gap-3 overflow-auto py-3">
            <p class="text-center w-100 text-muted">Clique em "Generate Tournament" para iniciar a simulação.</p>
        </div>
    </main>

    <!-- Footer Corrigido para fixar embaixo (fixed-bottom) -->
    <footer id="sticky-top-footer"
        class="fixed-bottom text-white d-flex align-items-center justify-content-center d-none"
        style="background-color: #0d3551; height: 60px; transition: opacity 0.3s ease; opacity: 0; z-index: 1030; border-top: 2px solid #28a745;">
        <div class="container d-flex justify-content-between align-items-center px-4">
            <span class="fw-semibold">Copa do Mundo 2026 - Final da Chave</span>
            <button class="btn btn-success btn-sm px-3" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <i class="bi bi-arrow-up-circle me-1"></i> Voltar ao Topo
            </button>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de ativação do Footer ajustado -->
    <script>
        window.addEventListener('scroll', function () {
            const footerElement = document.getElementById('sticky-top-footer');

            // Obtenção precisa do tamanho das barras
            const totalHeight = document.documentElement.scrollHeight;
            const currentScroll = window.innerHeight + window.scrollY;

            // Se chegar a menos de 50px do fim da página, exibe o rodapé
            if (currentScroll >= totalHeight - 50) {
                footerElement.classList.remove('d-none');
                setTimeout(() => {
                    footerElement.style.opacity = '1';
                }, 10);
            } else {
                footerElement.style.opacity = '0';
                setTimeout(() => {
                    if (footerElement.style.opacity === '0') {
                        footerElement.classList.add('d-none');
                    }
                }, 300);
            }
        });
    </script>
</body>

</html>
